name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: :contentReference[oaicite:0]{index=0}/snake-action@v3
        with:
          github_user_name: abdessemedhoussem2004-design
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: :contentReference[oaicite:1]{index=1}/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
